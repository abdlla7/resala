<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>App Settings</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Lexend -->
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee4b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102213",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2e1d",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
        /* Custom toggle switch style */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #2bee4b;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #2bee4b;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#0d1b10] dark:text-gray-100 transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark overflow-hidden pb-10">
<!-- TopAppBar -->
<div class="flex items-center px-4 py-3 justify-between sticky top-0 z-10 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[#0d1b10] dark:text-white" style="font-size: 24px;">arrow_back_ios_new</span>
</button>
<h2 class="text-[#0d1b10] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Settings</h2>
</div>
<!-- ProfileHeader -->
<div class="px-4 py-2">
<div class="bg-surface-light dark:bg-surface-dark rounded-2xl p-4 shadow-sm flex items-center gap-4">
<div class="relative shrink-0">
<div class="bg-center bg-no-repeat bg-cover rounded-full size-16 border-2 border-white dark:border-white/10 shadow-sm" data-alt="Portrait of Sarah Jenkins, Field Coordinator" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBqgEwMtubOg8psfCcLFriO_Z4juZm6FoCvHhvYmtX4SYmTWPx2MZIugRhw_kEgqt--xBsioPFrYDL_P8VX78h-zan6ldp5I2VVoOr0qHVNZBnOn3kvSMmRjPPkmm5SRZYRIsotZocTA3jN4eCGAZgKVe6EhGn7q54jmeDRxg36PZ11w_tCvmsDkzfqt7AMxHy5yp8qaB_d1f66jw2iEj2_53TflSuAm2wMj1bf3rMWV_mmZ_go4qZReRUhw3D9cdk0Pepxmq3MVA");'>
</div>
</div>
<div class="flex flex-col justify-center">
<p class="text-[#0d1b10] dark:text-white text-xl font-bold leading-tight tracking-[-0.015em]">Sarah Jenkins</p>
<p class="text-gray-500 dark:text-gray-400 text-sm font-medium leading-normal">Field Coordinator</p>
</div>
</div>
</div>
<!-- Section: Appearance -->
<div class="mt-2">
<h3 class="text-[#0d1b10] dark:text-gray-200 text-lg font-bold leading-tight tracking-[-0.015em] px-5 pb-3 pt-4">Appearance</h3>
<div class="grid grid-cols-2 gap-4 px-4">
<!-- Active Theme Card -->
<button class="group relative flex flex-col gap-3 rounded-2xl overflow-hidden shadow-md transition-transform active:scale-95 focus:outline-none ring-4 ring-primary ring-offset-2 ring-offset-background-light dark:ring-offset-background-dark">
<div class="absolute top-3 right-3 z-10 bg-primary rounded-full p-1 shadow-sm">
<span class="material-symbols-outlined text-white block" style="font-size: 16px;">check</span>
</div>
<div class="h-28 w-full bg-cover bg-center" data-alt="Abstract gradient pattern representing the Modern Green theme" style="background-image: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);">
<!-- Mini UI Mockup inside card -->
<div class="w-full h-full p-3 flex flex-col gap-2 opacity-80">
<div class="h-2 w-1/2 bg-white/40 rounded-full"></div>
<div class="h-2 w-3/4 bg-white/40 rounded-full"></div>
<div class="mt-auto h-8 w-full bg-white/90 rounded-lg shadow-sm"></div>
</div>
</div>
<div class="bg-surface-light dark:bg-surface-dark w-full p-3 text-left">
<p class="text-[#0d1b10] dark:text-white text-base font-bold">Modern Green</p>
</div>
</button>
<!-- Inactive Theme Card -->
<button class="group relative flex flex-col gap-3 rounded-2xl overflow-hidden shadow-sm border border-transparent hover:border-gray-200 dark:hover:border-gray-700 transition-all active:scale-95 focus:outline-none">
<div class="h-28 w-full bg-cover bg-center" data-alt="Abstract blue gradient pattern representing the Classic Blue theme" style="background-image: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);">
<!-- Mini UI Mockup inside card -->
<div class="w-full h-full p-3 flex flex-col gap-2 opacity-60 grayscale-[30%]">
<div class="h-2 w-1/2 bg-white/40 rounded-full"></div>
<div class="h-2 w-3/4 bg-white/40 rounded-full"></div>
<div class="mt-auto h-8 w-full bg-white/80 rounded-lg shadow-sm"></div>
</div>
</div>
<div class="bg-surface-light dark:bg-surface-dark w-full p-3 text-left">
<p class="text-[#0d1b10] dark:text-white text-base font-medium">Classic Blue</p>
</div>
</button>
</div>
</div>
<!-- Section: General -->
<div class="mt-4">
<h3 class="text-[#0d1b10] dark:text-gray-200 text-lg font-bold leading-tight tracking-[-0.015em] px-5 pb-2 pt-2">General</h3>
<div class="bg-surface-light dark:bg-surface-dark mx-4 rounded-2xl shadow-sm overflow-hidden divide-y divide-gray-100 dark:divide-gray-800">
<!-- Notifications Item -->
<div class="p-4 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-white/5 transition-colors cursor-pointer">
<div class="flex items-center gap-4">
<div class="bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 p-2 rounded-xl">
<span class="material-symbols-outlined block">notifications</span>
</div>
<span class="text-base font-medium text-[#0d1b10] dark:text-white">Notifications</span>
</div>
<!-- Toggle Switch -->
<label class="flex items-center cursor-pointer relative" for="toggle-notif">
<input checked="" class="sr-only peer" id="toggle-notif" type="checkbox"/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
<!-- Offline Mode Item -->
<div class="p-4 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-white/5 transition-colors cursor-pointer">
<div class="flex items-center gap-4">
<div class="bg-purple-50 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400 p-2 rounded-xl">
<span class="material-symbols-outlined block">download_for_offline</span>
</div>
<span class="text-base font-medium text-[#0d1b10] dark:text-white">Download for Offline</span>
</div>
<!-- Toggle Switch -->
<label class="flex items-center cursor-pointer relative" for="toggle-offline">
<input class="sr-only peer" id="toggle-offline" type="checkbox"/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
<!-- Language Item -->
<div class="p-4 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-white/5 transition-colors cursor-pointer">
<div class="flex items-center gap-4">
<div class="bg-orange-50 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 p-2 rounded-xl">
<span class="material-symbols-outlined block">language</span>
</div>
<span class="text-base font-medium text-[#0d1b10] dark:text-white">Language</span>
</div>
<div class="flex items-center gap-2">
<span class="text-gray-500 dark:text-gray-400 text-sm">English</span>
<span class="material-symbols-outlined text-gray-400 text-sm">arrow_forward_ios</span>
</div>
</div>
</div>
</div>
<!-- Section: Support -->
<div class="mt-4">
<h3 class="text-[#0d1b10] dark:text-gray-200 text-lg font-bold leading-tight tracking-[-0.015em] px-5 pb-2 pt-2">Support</h3>
<div class="bg-surface-light dark:bg-surface-dark mx-4 rounded-2xl shadow-sm overflow-hidden divide-y divide-gray-100 dark:divide-gray-800">
<!-- Help Center -->
<button class="w-full p-4 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-white/5 transition-colors text-left">
<div class="flex items-center gap-4">
<div class="bg-teal-50 dark:bg-teal-900/30 text-teal-600 dark:text-teal-400 p-2 rounded-xl">
<span class="material-symbols-outlined block">help</span>
</div>
<span class="text-base font-medium text-[#0d1b10] dark:text-white">Help Center</span>
</div>
<span class="material-symbols-outlined text-gray-400 text-sm">arrow_forward_ios</span>
</button>
<!-- Report Issue -->
<button class="w-full p-4 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-white/5 transition-colors text-left">
<div class="flex items-center gap-4">
<div class="bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 p-2 rounded-xl">
<span class="material-symbols-outlined block">bug_report</span>
</div>
<span class="text-base font-medium text-[#0d1b10] dark:text-white">Report an Issue</span>
</div>
<span class="material-symbols-outlined text-gray-400 text-sm">arrow_forward_ios</span>
</button>
</div>
</div>
<!-- Footer Actions -->
<div class="mt-8 px-4 flex flex-col items-center gap-6">
<button class="w-full py-4 rounded-xl border-2 border-red-100 dark:border-red-900/50 text-red-600 dark:text-red-400 font-bold text-base hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">logout</span>
                Sign Out
            </button>
<p class="text-center text-gray-400 dark:text-gray-600 text-sm font-medium pb-6">
                Version 2.4.1 (Build 8902)
            </p>
</div>
</div>
</body></html>
