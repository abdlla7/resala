<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Volunteer Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee4b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102213",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-[#0d1b10] dark:text-white transition-colors duration-300">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden group/design-root">
<!-- Decorative Background Elements for "Soft Light Green" feel -->
<div class="absolute top-[-20%] left-[-20%] w-[500px] h-[500px] bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[300px] h-[300px] bg-primary/5 rounded-full blur-[80px] pointer-events-none"></div>
<!-- Main Content Container -->
<div class="relative flex flex-col items-center justify-center flex-1 w-full max-w-md mx-auto px-6 py-8">
<!-- Header -->
<div class="w-full flex flex-col items-center pb-8">
<div class="h-16 w-16 bg-white dark:bg-[#1a3820] rounded-2xl flex items-center justify-center mb-6 shadow-sm border border-[#cfe7d3] dark:border-primary/20">
<span class="material-symbols-outlined text-4xl text-primary">volunteer_activism</span>
</div>
<h1 class="text-[#0d1b10] dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center">Welcome Back!</h1>
<p class="text-[#0d1b10]/70 dark:text-white/70 text-base font-normal leading-normal pt-2 text-center">Ready to continue your training?</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-[#0d1b10] dark:text-white text-sm font-semibold leading-normal ml-1">Email Address</label>
<div class="relative">
<input class="form-input flex w-full rounded-xl text-[#0d1b10] dark:text-white placeholder:text-[#4c9a59]/60 dark:placeholder:text-white/40 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#cfe7d3] dark:border-[#2bee4b]/20 bg-white dark:bg-[#1a3820] h-14 px-4 text-base font-normal leading-normal transition-all shadow-sm" placeholder="Enter your email" type="email" value=""/>
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-primary">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="text-[#0d1b10] dark:text-white text-sm font-semibold leading-normal ml-1">Password</label>
<div class="relative">
<input class="form-input flex w-full rounded-xl text-[#0d1b10] dark:text-white placeholder:text-[#4c9a59]/60 dark:placeholder:text-white/40 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#cfe7d3] dark:border-[#2bee4b]/20 bg-white dark:bg-[#1a3820] h-14 px-4 text-base font-normal leading-normal transition-all shadow-sm" placeholder="Enter your password" type="password" value=""/>
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-primary">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end -mt-1">
<a class="text-[#4c9a59] dark:text-primary text-sm font-medium leading-normal hover:underline transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Primary Action Button -->
<button class="mt-2 w-full h-14 bg-primary hover:bg-primary/90 active:scale-[0.98] rounded-xl text-[#0d1b10] text-lg font-bold leading-normal transition-all shadow-md shadow-primary/20 flex items-center justify-center gap-2" type="button">
                    Log In
                </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-4 py-8">
<div class="h-[1px] bg-[#cfe7d3] dark:bg-white/10 flex-1"></div>
<p class="text-[#0d1b10]/50 dark:text-white/50 text-xs font-medium uppercase tracking-wider">Or continue with</p>
<div class="h-[1px] bg-[#cfe7d3] dark:bg-white/10 flex-1"></div>
</div>
<!-- Social Login Buttons -->
<div class="w-full grid grid-cols-2 gap-4">
<button class="flex h-14 w-full items-center justify-center gap-3 rounded-xl border border-[#cfe7d3] dark:border-white/10 bg-white dark:bg-[#1a3820] hover:bg-gray-50 dark:hover:bg-white/5 active:scale-[0.98] transition-all shadow-sm">
<svg class="h-5 w-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-[#0d1b10] dark:text-white text-base font-semibold">Google</span>
</button>
<button class="flex h-14 w-full items-center justify-center gap-3 rounded-xl border border-[#cfe7d3] dark:border-white/10 bg-white dark:bg-[#1a3820] hover:bg-gray-50 dark:hover:bg-white/5 active:scale-[0.98] transition-all shadow-sm">
<svg aria-hidden="true" class="h-6 w-6 text-[#1877F2]" fill="currentColor" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" fill-rule="evenodd"></path>
</svg>
<span class="text-[#0d1b10] dark:text-white text-base font-semibold">Facebook</span>
</button>
</div>
<!-- Footer -->
<div class="mt-12 text-center">
<p class="text-[#0d1b10]/70 dark:text-white/70 text-sm font-medium">
                    New here? 
                    <a class="text-primary dark:text-primary font-bold hover:underline ml-1" href="#">Create an Account</a>
</p>
</div>
</div>
</div>
</body></html>
