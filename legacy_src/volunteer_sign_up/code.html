<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Volunteer Sign Up</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee4b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102213",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2c1e",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
        /* Custom scrollbar hiding for clean mobile view */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased selection:bg-primary/30">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark overflow-x-hidden transition-colors duration-300">
<!-- TopAppBar -->
<div class="flex items-center justify-between p-4 pb-2 z-10">
<button aria-label="Go back" class="text-[#0d1b10] dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex-1"></div>
<!-- Optional Help/Info Icon could go here -->
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 flex flex-col px-6 pb-6 overflow-y-auto no-scrollbar">
<!-- HeadlineText & Microcopy -->
<div class="flex flex-col items-center pt-2 pb-8 animate-fade-in-up">
<div class="w-16 h-16 rounded-full bg-primary/20 flex items-center justify-center mb-4 text-primary dark:text-[#2bee4b]">
<span class="material-symbols-outlined text-[32px]">diversity_1</span>
</div>
<h1 class="text-[#0d1b10] dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center">
                    Join our community
                </h1>
<p class="text-[#0d1b10]/70 dark:text-white/70 text-base font-medium leading-normal pt-3 text-center max-w-[280px]">
                    Train, learn, and help us change the world together.
                </p>
</div>
<!-- Social Sign-Up Buttons -->
<div class="flex flex-col gap-3 w-full">
<button class="flex w-full cursor-pointer items-center justify-center rounded-xl h-12 px-4 bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-surface-dark/80 transition-all duration-200 group">
<span class="material-symbols-outlined text-[#0d1b10] dark:text-white mr-3">public</span>
<span class="text-[#0d1b10] dark:text-white text-sm font-bold tracking-[0.015em]">Continue with Google</span>
</button>
<button class="flex w-full cursor-pointer items-center justify-center rounded-xl h-12 px-4 bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-surface-dark/80 transition-all duration-200 group">
<span class="material-symbols-outlined text-[#0d1b10] dark:text-white mr-3">groups</span>
<span class="text-[#0d1b10] dark:text-white text-sm font-bold tracking-[0.015em]">Continue with Facebook</span>
</button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 py-8 w-full">
<div class="h-px bg-gray-200 dark:bg-gray-700 flex-1"></div>
<span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Or sign up with email</span>
<div class="h-px bg-gray-200 dark:bg-gray-700 flex-1"></div>
</div>
<!-- Manual Form -->
<form class="flex flex-col gap-5 w-full" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="flex flex-col gap-1.5 group">
<label class="text-sm font-semibold text-[#0d1b10] dark:text-gray-200 ml-1" for="fullname">Full Name</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-xl bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 text-[#0d1b10] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 shadow-sm" id="fullname" placeholder="e.g. Alex Johnson" type="text"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-primary opacity-0 group-focus-within:opacity-100 transition-opacity duration-200 material-symbols-outlined text-[20px]">
                            check_circle
                        </span>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5 group">
<label class="text-sm font-semibold text-[#0d1b10] dark:text-gray-200 ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-xl bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 text-[#0d1b10] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 shadow-sm" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-[#0d1b10] dark:text-gray-200 ml-1" for="password">Create Password</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-xl bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 text-[#0d1b10] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 shadow-sm pr-12" id="password" placeholder="At least 8 characters" type="password"/>
<button class="absolute right-0 top-0 h-full px-4 text-gray-400 hover:text-[#0d1b10] dark:hover:text-white transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<button class="mt-4 flex w-full cursor-pointer items-center justify-center rounded-xl h-12 px-6 bg-primary text-[#0d1b10] text-base font-bold leading-normal tracking-wide shadow-lg shadow-primary/20 hover:shadow-primary/40 hover:-translate-y-0.5 active:translate-y-0 active:shadow-sm transition-all duration-200" type="submit">
                    Start Volunteering
                </button>
</form>
<!-- Footer Login Link -->
<div class="mt-8 text-center">
<p class="text-sm text-gray-500 dark:text-gray-400">
                    Already have an account? 
                    <a class="text-[#0d1b10] dark:text-white font-bold hover:text-primary dark:hover:text-primary transition-colors ml-1" href="#">Log In</a>
</p>
</div>
<div class="h-6"></div> <!-- Bottom Spacer -->
</div>
</div>
</body></html>
