<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Training Knowledge Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee4b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102213",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2e1d",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display transition-colors duration-200 antialiased selection:bg-primary selection:text-slate-900">
<div class="relative flex min-h-screen flex-col w-full max-w-md mx-auto bg-background-light dark:bg-background-dark overflow-hidden shadow-2xl">
<!-- Header -->
<header class="flex items-center justify-between p-5 pt-8 z-10">
<button aria-label="Close Quiz" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-700/50 transition-colors text-slate-800 dark:text-white">
<span class="material-symbols-outlined text-[28px]">close</span>
</button>
<div class="flex items-center gap-2">
<button aria-label="Help" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-700/50 transition-colors text-slate-800 dark:text-white">
<span class="material-symbols-outlined text-[24px]">help_outline</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-6 pb-6">
<!-- Progress Section -->
<div class="flex flex-col gap-2 mb-8">
<div class="flex justify-between items-end">
<span class="text-sm font-medium text-slate-500 dark:text-slate-400 tracking-wide">Question 3 of 10</span>
<span class="text-xs font-bold text-primary">30%</span>
</div>
<div class="h-2 w-full bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 30%;"></div>
</div>
</div>
<!-- Question -->
<h1 class="text-2xl md:text-[28px] font-bold leading-tight text-slate-900 dark:text-white mb-8 tracking-tight">
                What is the first step when arriving at a disaster relief site?
            </h1>
<!-- Answers List -->
<div class="flex flex-col gap-4">
<!-- Option 1 -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="quiz_answer" type="radio" value="option1"/>
<div class="relative flex items-center p-5 rounded-2xl bg-surface-light dark:bg-surface-dark border-2 border-transparent shadow-soft transition-all duration-200 hover:shadow-md peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:shadow-none peer-focus:ring-2 peer-focus:ring-primary/50 peer-focus:ring-offset-2 dark:peer-focus:ring-offset-background-dark">
<!-- Custom Checkbox Circle -->
<div class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 border-slate-300 dark:border-slate-600 mr-4 transition-colors peer-checked:group-[]:border-primary peer-checked:group-[]:bg-primary">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:group-[]:opacity-100 scale-0 peer-checked:group-[]:scale-100 transition-all">check</span>
</div>
<span class="text-base font-medium text-slate-700 dark:text-slate-200 group-hover:text-slate-900 dark:group-hover:text-white">
                            Immediately start distributing food
                        </span>
<!-- Selected State Checkmark Icon (Right Side) - Optional visual flair -->
<div class="absolute right-4 text-primary opacity-0 scale-75 transition-all duration-300 peer-checked:group-[]:opacity-100 peer-checked:group-[]:scale-100">
<span class="material-symbols-outlined">check_circle</span>
</div>
</div>
</label>
<!-- Option 2 (Selected State for Demo) -->
<label class="group relative cursor-pointer">
<input checked="" class="peer sr-only" name="quiz_answer" type="radio" value="option2"/>
<div class="relative flex items-center p-5 rounded-2xl bg-surface-light dark:bg-surface-dark border-2 border-transparent shadow-soft transition-all duration-200 hover:shadow-md peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:shadow-none peer-focus:ring-2 peer-focus:ring-primary/50 peer-focus:ring-offset-2 dark:peer-focus:ring-offset-background-dark">
<!-- Custom Checkbox Circle Logic embedded in styling above using peer-checked on parent input -->
<div class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 border-slate-300 dark:border-slate-600 mr-4 transition-colors group-has-[:checked]:border-primary group-has-[:checked]:bg-primary">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 group-has-[:checked]:opacity-100 scale-0 group-has-[:checked]:scale-100 transition-all">check</span>
</div>
<span class="text-base font-medium text-slate-700 dark:text-slate-200 group-hover:text-slate-900 dark:group-hover:text-white">
                            Report to the site coordinator for check-in
                        </span>
<div class="absolute right-4 text-primary opacity-0 scale-75 transition-all duration-300 group-has-[:checked]:opacity-100 group-has-[:checked]:scale-100">
<span class="material-symbols-outlined">check_circle</span>
</div>
</div>
</label>
<!-- Option 3 -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="quiz_answer" type="radio" value="option3"/>
<div class="relative flex items-center p-5 rounded-2xl bg-surface-light dark:bg-surface-dark border-2 border-transparent shadow-soft transition-all duration-200 hover:shadow-md peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:shadow-none peer-focus:ring-2 peer-focus:ring-primary/50 peer-focus:ring-offset-2 dark:peer-focus:ring-offset-background-dark">
<div class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 border-slate-300 dark:border-slate-600 mr-4 transition-colors peer-checked:group-[]:border-primary peer-checked:group-[]:bg-primary">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:group-[]:opacity-100 scale-0 peer-checked:group-[]:scale-100 transition-all">check</span>
</div>
<span class="text-base font-medium text-slate-700 dark:text-slate-200 group-hover:text-slate-900 dark:group-hover:text-white">
                            Set up a personal tent
                        </span>
<div class="absolute right-4 text-primary opacity-0 scale-75 transition-all duration-300 peer-checked:group-[]:opacity-100 peer-checked:group-[]:scale-100">
<span class="material-symbols-outlined">check_circle</span>
</div>
</div>
</label>
<!-- Option 4 -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="quiz_answer" type="radio" value="option4"/>
<div class="relative flex items-center p-5 rounded-2xl bg-surface-light dark:bg-surface-dark border-2 border-transparent shadow-soft transition-all duration-200 hover:shadow-md peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:shadow-none peer-focus:ring-2 peer-focus:ring-primary/50 peer-focus:ring-offset-2 dark:peer-focus:ring-offset-background-dark">
<div class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 border-slate-300 dark:border-slate-600 mr-4 transition-colors peer-checked:group-[]:border-primary peer-checked:group-[]:bg-primary">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:group-[]:opacity-100 scale-0 peer-checked:group-[]:scale-100 transition-all">check</span>
</div>
<span class="text-base font-medium text-slate-700 dark:text-slate-200 group-hover:text-slate-900 dark:group-hover:text-white">
                            Begin medical triage
                        </span>
<div class="absolute right-4 text-primary opacity-0 scale-75 transition-all duration-300 peer-checked:group-[]:opacity-100 peer-checked:group-[]:scale-100">
<span class="material-symbols-outlined">check_circle</span>
</div>
</div>
</label>
</div>
<!-- Spacer to push button to bottom if content is short -->
<div class="flex-1"></div>
<!-- Footer Action -->
<div class="mt-8 pt-4">
<button class="w-full flex items-center justify-center h-14 bg-primary hover:bg-green-400 active:scale-[0.98] transition-all rounded-xl shadow-lg shadow-green-400/20 dark:shadow-green-900/40 text-[#0d1b10] text-lg font-bold tracking-wide">
                    Next Question
                    <span class="material-symbols-outlined ml-2">arrow_forward</span>
</button>
</div>
</main>
</div>
</body></html>
