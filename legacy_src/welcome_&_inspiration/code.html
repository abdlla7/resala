<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "primary": "#2bee4b",

                    fontFamily: {

                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },

        }

<div class="w-full text-center space-y-4 pt-6 pb-8">
<h1 class="text-[#0d1b10] dark:text-white text-4xl font-bold leading-tight tracking-tight">

<p class="text-[#0d1b10]/70 dark:text-white/70 text-base font-normal leading-relaxed max-w-xs mx-auto">

                </p>
</div>

<div class="flex gap-4 justify-center mb-10">
<div class="flex items-center gap-1.5 px-3 py-1.5 bg-white dark:bg-[#1a331f] rounded-lg shadow-sm border border-gray-100 dark:border-[#2a4d30]">
